[server]
port=8443
ssl=true
certDir="/Volumes/Wisdom/MyIdea/CClaw/src/agentService/cert"
certFile=server.crt
keyFile=server.key
trustedProxies=
trustedForwardedHeaders=false
readTimeout=5
readHeaderTimeout=5
# writeTimeout=0: 不限制响应写超时。SSE/长任务(工具循环+OCR)的时长上限由应用层
# chatRunTimeout(默认 AgentRunTimeoutSecs,可用 CCLAW_CHAT_RUN_TIMEOUT_SEC 覆盖)决定,
# 不再依赖 http.Server 写超时掐断流。
writeTimeout=0
idleTimeout=1800
maxHeaderBytes=1048576
enableSwagger=true

maxChatConcurrency=1000
maxStreamConcurrency=800

[socket]
address=
port=17654
maxConnections=500000
bufferSize=8192
readTimeout=30
writeTimeout=10

