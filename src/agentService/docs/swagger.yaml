basePath: /api
definitions:
  basic.CommonResponse:
    properties:
      data:
        description: 具体的相应内容
      req_id:
        type: string
      req_method:
        description: 用户请求的方法
        type: string
      req_path:
        type: string
      req_timestamp:
        type: integer
      resp_code:
        description: 响应码,业务层级
        type: integer
      resp_msg:
        description: 响应的消息
        type: string
      resp_timestamp:
        type: integer
    type: object
  model.ChatRequest:
    properties:
      genAt:
        description: 消息的发送时间
        type: integer
      requestMsg:
        description: 聊天的内容
        type: string
      senderId:
        description: 发送者,如果为空,则采用系统默认的
        type: string
      sessionId:
        description: 表示会话的session，在一个会话中的就属于同一个session
        type: string
    type: object
  model.ChatResponse:
    properties:
      chatChannel:
        description: 聊天的频道,1=WEB,2,FEISHU 等
        type: integer
      chatId:
        description: 本次聊天的消息ID,用于标识本次聊天的位置
        type: integer
      chatType:
        description: 聊天类型，0/1:私聊/群聊
        type: integer
      senderId:
        description: 发送者,如果为空,则采用系统默认的
        type: string
      sessionId:
        type: string
    type: object
  model.ChatResponseEx:
    properties:
      data:
        $ref: '#/definitions/model.ChatResponse'
      req_id:
        type: string
      req_method:
        description: 用户请求的方法
        type: string
      req_path:
        type: string
      req_timestamp:
        type: integer
      resp_code:
        description: 响应码,业务层级
        type: integer
      resp_msg:
        description: 响应的消息
        type: string
      resp_timestamp:
        type: integer
    type: object
  model.ChatsRequest:
    properties:
      chatIds:
        items:
          type: string
        type: array
      senderId:
        type: string
    type: object
  model.ChatsResponseEx:
    properties:
      data:
        $ref: '#/definitions/model.ChatsRequest'
      req_id:
        type: string
      req_method:
        description: 用户请求的方法
        type: string
      req_path:
        type: string
      req_timestamp:
        type: integer
      resp_code:
        description: 响应码,业务层级
        type: integer
      resp_msg:
        description: 响应的消息
        type: string
      resp_timestamp:
        type: integer
    type: object
  model.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  model.LoginResponse:
    properties:
      displayName:
        type: string
      expiredLength:
        description: token失效时长,unit = second
        type: integer
      genAt:
        description: token产生的时间
        type: integer
      token:
        description: 用户登录成功后得到的token
        type: string
      userName:
        type: string
    type: object
  model.LoginResponseEx:
    properties:
      data:
        $ref: '#/definitions/model.LoginResponse'
      req_id:
        type: string
      req_method:
        description: 用户请求的方法
        type: string
      req_path:
        type: string
      req_timestamp:
        type: integer
      resp_code:
        description: 响应码,业务层级
        type: integer
      resp_msg:
        description: 响应的消息
        type: string
      resp_timestamp:
        type: integer
    type: object
  model.SessionRequest:
    properties:
      agentId:
        description: session对应的调用目标Agent
        type: string
      chatChannel:
        description: 聊天渠道
        type: integer
      chatType:
        description: 聊天类型
        type: integer
      senderId:
        description: 发起新会话的userName
        type: string
      sessionId:
        description: 标识会话session
        type: string
      sessionName:
        type: string
    type: object
  model.SessionResponse:
    properties:
      chatChannel:
        type: integer
      chatType:
        type: integer
      genAt:
        description: session创建的时间
        type: integer
      senderId:
        description: 发起新会话的userName
        type: string
      sessionData:
        description: 用来存放session所有交互历史的文件名,格式为JSON
        type: string
      sessionId:
        type: string
      sessionName:
        description: session name
        type: string
    type: object
  model.SessionResponseEx:
    properties:
      data:
        $ref: '#/definitions/model.SessionResponse'
      req_id:
        type: string
      req_method:
        description: 用户请求的方法
        type: string
      req_path:
        type: string
      req_timestamp:
        type: integer
      resp_code:
        description: 响应码,业务层级
        type: integer
      resp_msg:
        description: 响应的消息
        type: string
      resp_timestamp:
        type: integer
    type: object
  model.SessionsRequest:
    properties:
      endTime:
        type: integer
      senderId:
        description: userName
        type: string
      startTime:
        type: integer
    type: object
  model.SessionsResponse:
    properties:
      senderId:
        type: string
    type: object
  model.SessionsResponseEx:
    properties:
      data:
        $ref: '#/definitions/model.SessionsResponse'
      req_id:
        type: string
      req_method:
        description: 用户请求的方法
        type: string
      req_path:
        type: string
      req_timestamp:
        type: integer
      resp_code:
        description: 响应码,业务层级
        type: integer
      resp_msg:
        description: 响应的消息
        type: string
      resp_timestamp:
        type: integer
    type: object
host: localhost:8443
info:
  contact: {}
  description: API服务入口
  title: 企业级AI助手操作系统
  version: 1.0.0
paths:
  /chat:
    post:
      consumes:
      - application/json
      description: 新的聊天
      parameters:
      - description: Login成功返回后得到的token
        in: header
        name: AUTHORIZATION
        required: true
        type: string
      - description: 盐
        in: query
        name: NONCE
        required: true
        type: string
      - description: 数值,表示请求端请求的时间(秒数)
        in: query
        name: TIMESTAMP
        required: true
        type: string
      - description: 对请求内容的签名秒数
        in: query
        name: SIGNATURE
        required: true
        type: string
      - description: 聊天内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ChatResponseEx'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/basic.CommonResponse'
      summary: 新的聊天
      tags:
      - 聊天管理
  /createSession:
    post:
      consumes:
      - application/json
      description: 创建全新的聊天会话
      parameters:
      - description: Login成功返回后得到的token
        in: header
        name: AUTHORIZATION
        required: true
        type: string
      - description: 盐
        in: query
        name: NONCE
        required: true
        type: string
      - description: 数值,表示请求端请求的时间(秒数)
        in: query
        name: TIMESTAMP
        required: true
        type: string
      - description: 对请求内容的签名秒数
        in: query
        name: SIGNATURE
        required: true
        type: string
      - description: 聊天内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.SessionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.SessionResponseEx'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/basic.CommonResponse'
      summary: 创建新的会话
      tags:
      - 聊天管理
  /deleteChat:
    post:
      consumes:
      - application/json
      description: 删除聊天
      parameters:
      - description: Login成功返回后得到的token
        in: header
        name: AUTHORIZATION
        required: true
        type: string
      - description: 盐
        in: query
        name: NONCE
        required: true
        type: string
      - description: 数值,表示请求端请求的时间(秒数)
        in: query
        name: TIMESTAMP
        required: true
        type: string
      - description: 对请求内容的签名秒数
        in: query
        name: SIGNATURE
        required: true
        type: string
      - description: 聊天内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.ChatsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ChatsResponseEx'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/basic.CommonResponse'
      summary: 删除聊天
      tags:
      - 聊天管理
  /deleteSession:
    post:
      consumes:
      - application/json
      description: 获取会话历史
      parameters:
      - description: Login成功返回后得到的token
        in: header
        name: AUTHORIZATION
        required: true
        type: string
      - description: 盐
        in: query
        name: NONCE
        required: true
        type: string
      - description: 数值,表示请求端请求的时间(秒数)
        in: query
        name: TIMESTAMP
        required: true
        type: string
      - description: 对请求内容的签名秒数
        in: query
        name: SIGNATURE
        required: true
        type: string
      - description: 聊天内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.SessionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.SessionsResponseEx'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/basic.CommonResponse'
      summary: 获取会话历史
      tags:
      - 聊天管理
  /getSessions:
    post:
      consumes:
      - application/json
      description: 获取会话历史列表
      parameters:
      - description: Login成功返回后得到的token
        in: header
        name: AUTHORIZATION
        required: true
        type: string
      - description: 盐
        in: query
        name: NONCE
        required: true
        type: string
      - description: 数值,表示请求端请求的时间(秒数)
        in: query
        name: TIMESTAMP
        required: true
        type: string
      - description: 对请求内容的签名秒数
        in: query
        name: SIGNATURE
        required: true
        type: string
      - description: 聊天内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.SessionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.SessionsResponseEx'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/basic.CommonResponse'
      summary: 获取会话历史列表
      tags:
      - 聊天管理
  /heartbeat:
    get:
      consumes:
      - application/json
      description: 返回健康检测结果，JSON
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/basic.CommonResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/basic.CommonResponse'
      summary: 健康检测函数
      tags:
      - 健康检测
  /login:
    post:
      consumes:
      - application/json
      description: 实现用户登录功能
      parameters:
      - description: 盐
        in: query
        name: NONCE
        required: true
        type: string
      - description: 数值,表示请求端请求的时间(秒数)
        in: query
        name: TIMESTAMP
        required: true
        type: string
      - description: 对请求内容的签名
        in: query
        name: SIGNATURE
        required: true
        type: string
      - description: 登录用户名和密码
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.LoginResponseEx'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/basic.CommonResponse'
      summary: 用户登入API
      tags:
      - 用户登入登出
  /logout:
    get:
      consumes:
      - application/json
      description: 实现用户登出功能
      parameters:
      - description: Login成功返回后得到的token
        in: header
        name: AUTHORIZATION
        required: true
        type: string
      - description: 盐
        in: query
        name: NONCE
        required: true
        type: string
      - description: 数值,表示请求端请求的时间(秒数)
        in: query
        name: TIMESTAMP
        required: true
        type: string
      - description: 对请求内容的签名秒数
        in: query
        name: SIGNATURE
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/basic.CommonResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/basic.CommonResponse'
      summary: 用户登出API
      tags:
      - 用户登入登出
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: AUTHORIZATION
    type: apiKey
swagger: "2.0"
