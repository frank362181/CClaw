[memoryDb]
memoryDbType=1
address=35.77.68.24
port=6379
databaseName=0
username=
password=DH2dhd72ud29320dfs2333232
poolSize=500
minIdleConnections=5
maxRetries=3
dialTimeout=5
readTimeout=3
writeTimeout=3
healthCheckInterval=30
reconnectBaseDelay=500

[toolRule]
; 总开关:false = 不启用全策略(全部放行)
policyEnabled=true
functionCalling=true
; 是否支持 bash 类没有路径参数的命令执行
allowShell=true
; 是否开启沙箱
sandboxEnabled=true
; 沙箱内是否支持网络访问
sandboxNetwork=true
autoAllowBashIfSandboxed=true
; 读类工具允许读取的根(多个以,分割)
readRoots=
writeRoots=
; 绝对禁止路径
denyRoots=~/.ssh,~/.aws,~/.gnupg,~/.kube,~/.docker,~/.config/gcloud,~/.npmrc,~/.netrc,/etc/shadow,/etc/sudoers,.env,.pem,.key,.p12,.p8,.jks,.keystore,.sqlite

[chat]
# sessionRecord: 会话记录开关(阶段1双写)。
#   true  = 把会话/轮次/工具调用写入 t_session/t_turn/t_turn_tool,
#           并把内容追加到 <exeDir>/cclaw/chat_history/<sessionId>/memory_{datetime}.md;
#   false = 完全不记录(纯旁路,不影响聊天主流程)。
# 说明:该记录目前“只写不读”,不参与 system prompt 与上下文装配;
#       任一环节失败仅记日志,不会影响给用户的回复。
sessionRecord=true

[routing]
;agent路由总开关,false=完全不判断
enabled=false
;true=照常判断
dryRun=true
; 灰度期:false时分诊照跑单一律走单Agent
allowDelegate=false
;进入delegate的置信度门槛
delegateConfidence=0.6
; 命中结构强信号,即使LLM给single也强制进入B段
strongSignalOverride=true
;能力跨度阈值:涉及多个agent才算复杂
minCapabilitySpan=2
;材料数量强信号阈值
minMaterialsStrong=3
; 关键词规则:hint(只加分)/hard(直接single)
keywordRuleMode=hint
;speed/balanced/quality,只映射delegateConfidence与minMaterialsStrong
qualityPreset=balanced

[collaboration]
;规划的最多任务数量
maxTasks=5
; 最大并行的worker数量
maxParallels=3
; 单个任务的超时时间（秒）
taskTimeout=180
; 监控阈值:无事件多久log一个warn(秒)/多久取消(秒)
stallWarn=60
stallKill=180
;worker产出摘要的上限
summaryMaxRunes=800
;分诊一次调用的max tokens
triageMaxTokens=1024
; 计划linter不通过时的回填重试次数
lintRetries=2
;专职评估者:优先级:本配置 > 数据库中配置 > 指派
evaluatorAgentId=

[evaluate]
;true=评估照样落库,但评估失败不改动回复
shadowOnly=true
;strong/moderate,评估agent的强度
minIndependence=moderate
; 评估输入总长上限
inputMaxRunes=12000
;评估后级联修复的轮数
maxRepairRounds=1
;每轮涉及的重做任务数上限
maxRepairTasks=2
;评审调用占本轮预算的比例上限
budgetRatio=0.3
;blocker未解决时:true=降级标注后仍输出;false=争论失败
blockOnBlocker=true