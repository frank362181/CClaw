[server]
port=8443
ssl=true
certDir="/Volumes/Wisdom/MyIdea/CClaw/src/agentService/cert"
certFile=server.crt
keyFile=server.key
trustedProxies=
trustedForwardedHeaders=false
readTimeout=5
readHeaderTimeout=5
# writeTimeout=0: 不限制响应写超时。SSE/长任务(工具循环+OCR)的时长上限由应用层
# chatRunTimeout(默认 AgentRunTimeoutSecs,可用 CCLAW_CHAT_RUN_TIMEOUT_SEC 覆盖)决定,
# 不再依赖 http.Server 写超时掐断流。
writeTimeout=0
idleTimeout=1800
maxHeaderBytes=1048576
enableSwagger=true

maxChatConcurrency=1000
maxStreamConcurrency=800

[socket]
address=
port=17654
maxConnections=500000
bufferSize=8192
readTimeout=30
writeTimeout=10

[logging]
path=log

[security]
blackUrl=
blackIP=
allowedUrl=/api/login,/api/logout,/api/chat,/api/chat/stream,/api/chat/interrupt,/api/llmProviders,/api/llmProvider/add,/api/llmProvider/update,/api/llmProvider/remove,/api/agents,/api/agent/add,/api/agent/update,/api/agent/remove,/api/agent/startupFiles,/api/agent/startupFile,/api/skills,/api/skill/add,/api/skill/update,/api/skill/remove,/api/GetSessions,/api/GetSessionTurns
deSecurityUrl=/api/logout
unWantedToken=/api/login
unTrafficUrl=
allowedOrigins=
signKey="123456"

[database]
dbType=3
server =
port=5432
dataDir="/Volumes/Wisdom/MyIdea/CClaw/src/data"
dbname="cclaw.db"
sslMode=true
username="postgres"
password="3ETC3_sS8wTKB"
min_connections=5
max_connections=10
connection_timeout=10
connection_idle=900
connection_ttl=1800

max_retries=5
retry_base_delay=1.0
retry_max_delay=60.0
retry_jitter=0.1
