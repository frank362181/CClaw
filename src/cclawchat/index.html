<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https:; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'" />
    <title>CClaw Chat · 资产智能管理助手</title>

    <!-- 禁止缓存：防止浏览器复用旧版本导致空白页（若出现空白页请 Ctrl+Shift+R 强刷） -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- 外链全局样式（带版本号，防缓存白屏） -->
    <link rel="stylesheet" href="./styles/main.css" />

    <style>
        /* -------- 应用外壳 ---------- */
        #app {
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* 自定义元素（页面组件）宿主布局 */
        login-page,
        home-page,
        chat-page {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 聊天抽屉内嵌聊天组件：占满抽屉内容区 */
        .drawer-body chat-page {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 组件加载占位（组件挂载后由 Shadow DOM 内容替换） */
        .loading-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-size: 18px;
            color: #9A9AB0;
            background: #F5F7FA;
        }

        .loading-placeholder .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #E8ECF1;
            border-top-color: #4A6CF7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- 登录组件（视图来自 pages/login.html） -->
    <login-page>
        <div class="loading-placeholder">
            <div class="spinner"></div>
            <span>加载登录组件…</span>
        </div>
    </login-page>

    <!-- 主页组件（登录后显示：左侧目录树 + 内容区 + 聊天气泡，视图来自 pages/home.html） -->
    <home-page>
        <div class="loading-placeholder">
            <div class="spinner"></div>
            <span>加载主页组件…</span>
        </div>
    </home-page>

    <!-- 聊天抽屉（最右侧，内含聊天组件 chat.html） -->
    <div id="chatDrawer" class="chat-drawer">
        <div id="drawerOverlay" class="drawer-overlay"></div>
        <div class="drawer-panel">
            <div class="drawer-header">
                <div class="drawer-title">
                    <span class="drawer-icon">💬</span>
                    <span>AI 助手</span>
                    <span class="drawer-status-dot" title="在线"></span>
                </div>
            </div>
            <div class="drawer-body">
                <!-- 聊天组件（视图来自 pages/chat.html） -->
                <chat-page>
                    <div class="loading-placeholder">
                        <div class="spinner"></div>
                        <span>加载聊天组件…</span>
                    </div>
                </chat-page>
            </div>
        </div>
    </div>
</div>

<!-- axios（本地 vendor 的全局 UMD 构建，挂载到 window.axios，供 scripts/modules/api.js 使用；离线可用） -->
<script src="./scripts/modules/vendor/axios.min.js"></script>

<!-- 主应用脚本 (ES Module) —— 带版本号，强制浏览器在版本更新时重新拉取，避免缓存导致白屏 -->
<script type="module" src="./scripts/main.js?v=20260826"></script>

</body>
</html>
