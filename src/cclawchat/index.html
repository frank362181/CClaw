<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https:; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'" />
    <title>CClaw Chat · 资产智能管理助手</title>

    <!-- 禁止缓存：防止浏览器复用旧版本导致空白页（若出现空白页请 Ctrl+Shift+R 强刷） -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- 外链全局样式（带版本号，防缓存白屏） -->
    <link rel="stylesheet" href="./styles/main.css?v=20261111a" />

    <style>
        /* -------- 应用外壳：主界面左右分栏（左侧项目内容 / 右侧聊天） ---------- */
        #app {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* 自定义元素（页面组件）宿主布局 */
        login-page,
        home-page {
            display: block;
            flex: 1 1 auto;
            min-width: 0;
            height: 100%;
        }

        /* 聊天面板：登录后常驻右侧，固定占主界面 40% 宽（显隐由 ChatPage.show/hide 控制） */
        chat-page {
            display: none;
            flex: 0 0 40%;
            width: 40%;
            min-width: 0;
            height: 100%;
            /* 顶部工具栏横跨整屏，聊天面板内容整体下移，避免被工具栏遮挡 */
            padding-top: var(--home-header-height, 44px);
            border-left: 1px solid #E8ECF1;
            background: #FFFFFF;
        }

        /* 小屏：左右分栏改为上下分栏，聊天面板占 40% 高度 */
        @media (max-width: 768px) {
            #app {
                flex-direction: column;
            }

            login-page,
            home-page {
                flex: 1 1 auto;
                height: auto;
                min-height: 0;
            }

            chat-page {
                flex: 0 0 40%;
                width: 100%;
                height: 40%;
                border-left: none;
                border-top: 1px solid #E8ECF1;
            }
        }

        /* 组件加载占位（组件挂载后由 Shadow DOM 内容替换） */
        .loading-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-size: 18px;
            color: #9A9AB0;
            background: #F5F7FA;
        }

        .loading-placeholder .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #E8ECF1;
            border-top-color: #4A6CF7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- 登录组件（视图来自 pages/login.html） -->
    <login-page>
        <div class="loading-placeholder">
            <div class="spinner"></div>
            <span>加载登录组件…</span>
        </div>
    </login-page>

    <!-- 主页组件（登录后显示：左侧项目内容区，视图来自 pages/home.html） -->
    <home-page>
        <div class="loading-placeholder">
            <div class="spinner"></div>
            <span>加载主页组件…</span>
        </div>
    </home-page>

    <!-- 右侧聊天面板（常驻，占主界面 40%，内含聊天组件 chat.html） -->
    <chat-page>
        <div class="loading-placeholder">
            <div class="spinner"></div>
            <span>加载聊天组件…</span>
        </div>
    </chat-page>
</div>

<!-- axios（本地 vendor 的全局 UMD 构建，挂载到 window.axios，供 scripts/modules/api.js 使用；离线可用） -->
<script src="./scripts/modules/vendor/axios.min.js"></script>

<!-- 主应用脚本 (ES Module) —— 带版本号，强制浏览器在版本更新时重新拉取，避免缓存导致白屏 -->
<script type="module" src="./scripts/main.js?v=20261111a"></script>

</body>
</html>
