<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CClaw Chat · 智能对话助手</title>

    <!-- 外链全局样式 -->
    <link rel="stylesheet" href="./styles/main.css" />

    <style>
        /* -------- 应用外壳 ---------- */
        #app {
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* 自定义元素（页面组件）宿主布局 */
        login-page,
        chat-page {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 组件加载占位（组件挂载后由 Shadow DOM 内容替换） */
        .loading-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-size: 18px;
            color: #9A9AB0;
            background: #F5F7FA;
        }

        .loading-placeholder .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #E8ECF1;
            border-top-color: #4A6CF7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div id="app">
    <!--
        应用外壳：仅声明两个页面组件挂载点。
        组件的视图与行为分别来自 pages/*.html 与 scripts/modules/*.js，
        由 scripts/modules/component.js 动态加载并注入 Shadow DOM。
    -->

    <!-- 登录组件（视图来自 pages/login.html） -->
    <login-page>
        <div class="loading-placeholder">
            <div class="spinner"></div>
            <span>加载登录组件…</span>
        </div>
    </login-page>

    <!-- 聊天组件（视图来自 pages/chat.html） -->
    <chat-page>
        <div class="loading-placeholder">
            <div class="spinner"></div>
            <span>加载聊天组件…</span>
        </div>
    </chat-page>
</div>

<!-- 主应用脚本 (ES Module) -->
<script type="module" src="./scripts/main.js"></script>

</body>
</html>
