<!--
    ============================================================
    登录页组件视图 (LoginPage)
    ============================================================
    本文件是 <login-page> 组件的视图模板（纯 HTML 片段），
    由 scripts/modules/component.js 动态加载并注入 Shadow DOM，
    交互逻辑由 scripts/modules/login.js 控制。
    ============================================================
-->
<div id="loginPage" class="login-page">
    <div class="login-card">
        <div class="login-logo">
            <div class="logo-icon">AI</div>
            <h1>企业智能平台</h1>
            <!--<p>登录以继续您的对话</p>-->
        </div>

        <div id="loginError" class="login-error">
            ⚠️ 用户名或密码错误，请重试。
        </div>

        <form id="loginForm" class="login-form" autocomplete="off">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" placeholder="请输入用户名" value="" required />
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码" value="" required />
            </div>
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" checked /> 记住我
                </label>
                <a href="#" class="forgot-link">忘记密码？</a>
            </div>
            <button type="submit" id="btnLogin" class="btn-login">
                <span class="btn-text">登 录</span>
                <span class="spinner"></span>
            </button>
        </form>

        <div class="login-footer">
            还没有账号？ <a href="#">立即注册</a>
        </div>
    </div>
</div>
