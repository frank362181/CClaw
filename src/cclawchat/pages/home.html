<!--
    ============================================================
    主页组件视图 (HomePage)
    ============================================================
    本文件是 <home-page> 组件的视图模板（纯 HTML 片段），
    由 scripts/modules/component.js 动态加载并注入 Shadow DOM，
    交互逻辑由 scripts/modules/home.js 控制。

    页面结构：
      - 左侧边栏：目录树菜单（dashboard / 资产台账）
      - 右侧核心内容显示区域（按菜单动态渲染）
      - 右上角聊天气泡：点击后由外部以抽屉方式打开 chat.html
    注意：初始不带 active 类，登录组件优先展示，
    由 Auth.restore() / Auth.login() 决定是否切换到主页。
    ============================================================
-->
<div id="homePage" class="home-page">

    <!-- 移动端主侧边栏遮罩 -->
    <div id="homeSidebarOverlay" class="home-sidebar-overlay"></div>

    <!-- 左侧应用侧边栏：目录树 -->
    <aside id="homeSidebar" class="home-sidebar">
        <div class="home-sidebar-header">
            <a href="#" class="home-brand">
                <span class="home-logo">AI</span>
                <span class="home-brand-name">资产管理智能助手</span>
            </a>
        </div>

        <!-- 目录树 -->
        <nav class="menu-tree" id="menuTree">
            <div class="tree-group-label">导航</div>

            <div class="tree-item" data-menu="dashboard" title="dashboard">
                <span class="tree-icon">📊</span>
                <span class="tree-label">dashboard</span>
            </div>

            <div class="tree-item" data-menu="asset" title="资产台账">
                <span class="tree-icon">📋</span>
                <span class="tree-label">资产台账</span>
            </div>

            <div class="tree-item" data-menu="settings" title="系统设置">
                <span class="tree-icon">⚙️</span>
                <span class="tree-label">系统设置</span>
            </div>
        </nav>

    </aside>

    <!-- 右侧核心内容显示区域 -->
    <main class="home-main">
        <header class="home-content-header">
            <div class="content-header-left">
                <button id="btnToggleHomeSidebar" class="btn-toggle-home-sidebar" title="切换侧边栏">☰</button>
                <div class="content-breadcrumb">
                    <span class="crumb-root">首页</span>
                    <span class="crumb-sep">/</span>
                    <span id="contentTitle" class="crumb-current">dashboard</span>
                </div>
            </div>
            <div class="content-actions">
                <!-- 右上角：当前登录用户 + 退出登录 -->
                <div class="home-user" title="当前登录用户">
                    <span class="avatar" id="homeAvatar">U</span>
                    <span id="homeUserName">用户</span>
                </div>
                <button id="btnHomeLogout" class="btn-logout" title="退出登录">⏻</button>
                <!-- 聊天气泡：点击后在最右侧以抽屉方式打开 chat.html -->
                <button id="chatBubble" class="chat-bubble" title="打开 AI 助手">
                    <span class="bubble-icon">🤖</span>
                    <span class="bubble-dot"></span>
                </button>
            </div>
        </header>

        <!-- 核心内容区（按菜单动态渲染） -->
        <div id="contentView" class="content-view">
            <!-- 由 HomePage.selectMenu() 渲染 -->
        </div>
    </main>

    <!-- 退出确认弹窗（二次确认） -->
    <div id="homeLogoutConfirm" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="homeLogoutConfirmTitle">
        <div class="modal-box">
            <div class="modal-title" id="homeLogoutConfirmTitle">确认退出登录？</div>
            <div class="modal-text">退出后需要重新登录才能继续使用，是否继续？</div>
            <div class="modal-actions">
                <button type="button" id="btnCancelLogout" class="btn-modal-cancel">取消</button>
                <button type="button" id="btnConfirmLogout" class="btn-modal-confirm">确认退出</button>
            </div>
        </div>
    </div>
</div>
