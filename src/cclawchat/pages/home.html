<!--
    ============================================================
    主页组件视图 (HomePage)
    ============================================================
    本文件是 <home-page> 组件的视图模板（纯 HTML 片段），
    由 scripts/modules/component.js 动态加载并注入 Shadow DOM，
    交互逻辑由 scripts/modules/home.js 控制。

    页面结构：
      - 左侧边栏：目录树菜单（我的项目 / 系统设置）
      - 右侧核心内容显示区域（按菜单动态渲染）
      - 右上角聊天气泡：点击后由外部以抽屉方式打开 chat.html
    注意：初始不带 active 类，登录组件优先展示，
    由 Auth.restore() / Auth.login() 决定是否切换到主页。
    ============================================================
-->
<div id="homePage" class="home-page">

    <!-- 移动端主侧边栏遮罩 -->
    <div id="homeSidebarOverlay" class="home-sidebar-overlay"></div>

    <!-- 左侧应用侧边栏：目录树 -->
    <aside id="homeSidebar" class="home-sidebar">
        <div class="home-sidebar-header">
            <a href="#" class="home-brand">
                <span class="home-logo">AI</span>
                <span class="home-brand-name">资产管理智能助手</span>
            </a>
        </div>

        <!-- 目录树 -->
        <nav class="menu-tree" id="menuTree">
            <div class="tree-group-label">导航</div>

            <div class="tree-item" data-menu="npa" title="我的项目">
                <span class="tree-icon">🏦</span>
                <span class="tree-label">我的项目</span>
            </div>

            <div class="tree-item" data-menu="settings" title="系统设置">
                <span class="tree-icon">⚙️</span>
                <span class="tree-label">系统设置</span>
            </div>
        </nav>

    </aside>

    <!-- 右侧核心内容显示区域 -->
    <main class="home-main">
        <header class="home-content-header">
            <div class="content-header-left">
                <button id="btnToggleHomeSidebar" class="btn-toggle-home-sidebar" title="切换侧边栏">☰</button>
                <div class="content-breadcrumb">
                    <span class="crumb-root">首页</span>
                    <span class="crumb-sep">/</span>
                    <span id="contentTitle" class="crumb-current">我的项目</span>
                </div>
            </div>
            <div class="content-actions">
                <!-- 右上角：当前登录用户（点击弹出 修改密码/修改个人信息 菜单） + 退出登录 -->
                <div class="home-user-wrap">
                    <div class="home-user" id="homeUserInfo" title="当前登录用户">
                        <span class="avatar" id="homeAvatar">U</span>
                        <span id="homeUserName">用户</span>
                        <span class="user-caret">▾</span>
                    </div>
                    <div class="user-menu" id="userMenu">
                        <button type="button" class="user-menu-item" id="btnChangePassword">🔒 修改密码</button>
                        <button type="button" class="user-menu-item" id="btnEditProfile">👤 修改个人信息</button>
                    </div>
                </div>
                <button id="btnHomeLogout" class="btn-logout" title="退出登录">⏻</button>
            </div>
        </header>

        <!-- 核心内容区（按菜单动态渲染） -->
        <div id="contentView" class="content-view">
            <!-- 由 HomePage.selectMenu() 渲染 -->
        </div>
    </main>

    <!-- AI 助手浮动入口：右下角悬浮图标，点击以侧窗口（抽屉）方式打开 chat.html -->
    <button id="chatBubble" class="chat-bubble chat-bubble-float" title="打开 AI 助手">
        <span class="bubble-icon">💬</span>
    </button>

    <!-- 退出确认弹窗（二次确认） -->
    <div id="homeLogoutConfirm" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="homeLogoutConfirmTitle">
        <div class="modal-box">
            <div class="modal-title" id="homeLogoutConfirmTitle">确认退出登录？</div>
            <div class="modal-text">退出后需重新登录才能继续使用，是否继续？</div>
            <div class="modal-actions">
                <button type="button" id="btnCancelLogout" class="btn-modal-cancel">取消</button>
                <button type="button" id="btnConfirmLogout" class="btn-modal-confirm">确认退出</button>
            </div>
        </div>
    </div>

    <!-- 我的项目：删除确认弹窗（风格与退出确认一致） -->
    <div id="npaDeleteConfirm" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="npaDeleteConfirmTitle">
        <div class="modal-box">
            <div class="modal-title" id="npaDeleteConfirmTitle">确认删除项目？</div>
            <div class="modal-text" id="npaDeleteConfirmText"></div>
            <div class="modal-actions">
                <button type="button" id="btnNpaDeleteCancel" class="btn-modal-cancel">取消</button>
                <button type="button" id="btnNpaDeleteConfirm" class="btn-modal-confirm">确认删除</button>
            </div>
        </div>
    </div>

    <!-- 我的项目：新建项目弹窗 -->
    <div id="npaCreateModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="npaCreateModalTitle">
        <div class="modal-box modal-box-form">
            <div class="modal-title" id="npaCreateModalTitle">新建项目</div>
            <div class="npa-form">
                <div class="npa-form-row">
                    <label class="npa-form-label" for="npaName">项目名称</label>
                    <input type="text" id="npaName" class="setting-input npa-form-input" placeholder="如：某地产集团不良资产包" maxlength="50" />
                </div>
                <div class="npa-form-row">
                    <label class="npa-form-label" for="npaFile">项目文件</label>
                    <input type="file" id="npaFile" class="npa-file-input" accept=".json,.csv,.txt" />
                </div>
                <div class="npa-form-error" id="npaFormError"></div>
            </div>
            <div class="modal-actions">
                <button type="button" id="btnNpaCancel" class="btn-modal-cancel">取消</button>
                <button type="button" id="btnNpaConfirm" class="btn-modal-confirm">创建项目</button>
            </div>
        </div>
    </div>

    <!-- 我的项目：户分析与格式文件弹窗 -->
    <div id="npaFileModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="npaFileModalTitle">
        <div class="modal-box modal-box-file">
            <div class="modal-title" id="npaFileModalTitle">户分析与格式文件</div>
            <div class="npa-file-view" id="npaFileView"></div>
            <div class="modal-actions">
                <button type="button" id="btnNpaFileDownload" class="btn-modal-cancel">⬇ 下载格式文件</button>
                <button type="button" id="btnNpaFileClose" class="btn-modal-confirm">关闭</button>
            </div>
        </div>
    </div>

    <!-- 修改密码弹窗 -->
    <div id="changePwdModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="changePwdModalTitle">
        <div class="modal-box modal-box-form">
            <div class="modal-title" id="changePwdModalTitle">修改密码</div>
            <div class="npa-form">
                <div class="npa-form-row">
                    <label class="npa-form-label" for="oldPassword">原密码</label>
                    <input type="password" id="oldPassword" class="setting-input npa-form-input" placeholder="请输入原密码" />
                </div>
                <div class="npa-form-row">
                    <label class="npa-form-label" for="newPassword">新密码</label>
                    <input type="password" id="newPassword" class="setting-input npa-form-input" placeholder="请输入新密码" />
                </div>
                <div class="npa-form-row">
                    <label class="npa-form-label" for="confirmPassword">确认新密码</label>
                    <input type="password" id="confirmPassword" class="setting-input npa-form-input" placeholder="请再次输入新密码" />
                </div>
                <div class="npa-form-error" id="changePwdError"></div>
            </div>
            <div class="modal-actions">
                <button type="button" id="btnChangePwdCancel" class="btn-modal-cancel">取消</button>
                <button type="button" id="btnChangePwdConfirm" class="btn-modal-confirm">确认修改</button>
            </div>
        </div>
    </div>

    <!-- 修改个人信息弹窗 -->
    <div id="editProfileModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="editProfileModalTitle">
        <div class="modal-box modal-box-form">
            <div class="modal-title" id="editProfileModalTitle">修改个人信息</div>
            <div class="npa-form">
                <div class="npa-form-row">
                    <label class="npa-form-label" for="profileDisplayName">显示名称</label>
                    <input type="text" id="profileDisplayName" class="setting-input npa-form-input" placeholder="请输入显示名称" maxlength="20" />
                </div>
                <div class="npa-form-row">
                    <label class="npa-form-label" for="profileEmail">邮箱</label>
                    <input type="text" id="profileEmail" class="setting-input npa-form-input" placeholder="请输入邮箱" />
                </div>
                <div class="npa-form-error" id="editProfileError"></div>
            </div>
            <div class="modal-actions">
                <button type="button" id="btnEditProfileCancel" class="btn-modal-cancel">取消</button>
                <button type="button" id="btnEditProfileConfirm" class="btn-modal-confirm">保存</button>
            </div>
        </div>
    </div>
</div>
